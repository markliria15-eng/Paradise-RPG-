name: Teste automatico

# Abre o jogo sem janela (Godot 4.6.3, modo offline) e roda tests/teste_automatico.tscn:
# dados (missoes, NPCs, itens, sprites), os 5 mapas, missao, montaria, pet, menus e toque.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "website/**", "site/**"]
  pull_request:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot 4.6.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Cache da importacao
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ hashFiles('**/*.import') }}
          restore-keys: godot-import-

      - name: Importar assets
        run: timeout 1800 ./godot --headless --import --path . || true

      - name: Rodar o teste
        env:
          PARADISE_MMO_ENV: local
        run: timeout 600 ./godot --headless --path . res://tests/teste_automatico.tscn -- --offline-test
